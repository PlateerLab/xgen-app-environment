[project]
name = "xgen-app-environment"
version = "0.1.0"
description = "XGEN app templates and the shared runtime environment every container that builds or runs them uses"
readme = "README.md"
# 이 패키지를 쓰는 이미지마다 파이썬이 다르다(앱 런타임 3.14, 배포 서비스 3.13). 앱이 도는 버전과 별개다.
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "PlateerLab"}]
keywords = ["xgen", "app", "template", "sandbox", "fastapi", "react"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
# 의존성을 두지 않는다. 기반 이미지 빌드 단계에서도, 앱이 물려받는 site-packages 안에서도 아무것도 끌어오지 않게.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xgen-app-env = "xgen_app_environment.cli:main"

[project.urls]
Repository = "https://github.com/PlateerLab/xgen-app-environment"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xgen_app_environment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
